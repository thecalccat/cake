<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ink by B. Cake - Tattoo Artist</title>
<meta name="description" content="Custom tattoos by B. Cake. Tap the pack to open." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<style>
/* ---------- landing-only styles ---------- */
html,body{height:100%;overflow:hidden;}
body.done{overflow:auto;}
#bgWhite{position:fixed;inset:0;background:#ffffff;z-index:0;}
#bgCard{position:fixed;inset:0;background:url('cake-main-background.png') center/cover no-repeat,var(--grad-card);z-index:0;opacity:0;transition:opacity 1.1s ease;}
body.toCard #bgCard{opacity:1;}
body.toCard.dim #bgCard{opacity:.55;}      /* mobile legibility */
#starburst{position:fixed;top:50%;left:50%;width:60vmax;height:60vmax;transform:translate(-50%,-50%) scale(.2);
  background:radial-gradient(circle,#ffffff 0%,rgba(255,255,255,.85) 22%,rgba(255,255,255,0) 60%);
  z-index:3;opacity:0;pointer-events:none;}
#starburst.fire{animation:burst 1s ease-out forwards;}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}

#taphint{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%);width:max-content;max-width:92vw;
  text-align:center;pointer-events:none;font-family:var(--font-display);font-weight:700;font-size:clamp(17px,4.6vw,23px);
  letter-spacing:1px;color:var(--ink);animation:pulse 1.7s ease-in-out infinite;}
#taphint .sub{display:block;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:5px;}
@keyframes pulse{0%,100%{opacity:.78}50%{opacity:1}}

#stage{position:relative;z-index:4;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;padding:24px;transition:gap .4s;}

/* ===== PACK ===== */
#packWrap{perspective:1100px;animation:packfloat 3.4s ease-in-out infinite;position:relative;--pf:200px;}
@keyframes packfloat{0%,100%{transform:translateY(calc(var(--pf) - 9px))}50%{transform:translateY(calc(var(--pf) + 9px))}}
.pack{width:min(62vw,240px);aspect-ratio:5/8;border-radius:20px;position:relative;cursor:pointer;
  transform-style:preserve-3d;overflow:hidden;
  background:linear-gradient(150deg,#2b2b2e 0%,#0b0b0d 46%,#000 100%);
  box-shadow:0 20px 44px rgba(0,0,0,.45),inset 0 0 0 2px rgba(244,201,69,.35),inset 0 0 30px rgba(0,0,0,.6);
  animation:twist 3.6s ease-in-out infinite alternate;}
@keyframes twist{0%{transform:rotateY(-17deg)}100%{transform:rotateY(17deg)}}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 48%,transparent 64%);
  background-size:250% 250%;animation:gloss 3.6s ease-in-out infinite;}
@keyframes gloss{0%{background-position:130% 0}55%,100%{background-position:-60% 0}}
.pack .logo{position:absolute;top:50%;left:50%;width:54%;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
.pack .pname{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--gold);font-family:var(--font-display);
  font-weight:700;font-size:clamp(15px,4.6vw,21px);letter-spacing:1px;}
.pack .pname small{display:block;color:#c9b56a;font-weight:500;font-size:.6em;letter-spacing:3px;}
.pack .seam{position:absolute;top:0;left:0;right:0;height:18px;background:repeating-linear-gradient(90deg,rgba(244,201,69,.5) 0 5px,transparent 5px 11px);opacity:.5;}
.pack.rip{animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) translateX(-4px)}40%{transform:rotate(3deg) translateX(4px)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.pack .tearline{position:absolute;top:14px;left:-5%;right:-5%;height:20px;z-index:5;opacity:0;
  background:#fff;clip-path:polygon(0 50%,5% 0,10% 60%,16% 10%,22% 70%,28% 12%,34% 65%,40% 5%,46% 60%,52% 8%,58% 66%,64% 6%,70% 62%,76% 10%,82% 68%,88% 4%,94% 60%,100% 8%,100% 100%,0 100%);}
.pack.rip .tearline{animation:tearShow .5s ease forwards;}
@keyframes tearShow{0%{opacity:0;transform:scaleY(0)}40%{opacity:1}100%{opacity:1;transform:scaleY(1)}}
.pack.fall{animation:fall .65s cubic-bezier(.5,0,.9,.4) forwards;}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(115vh) rotate(12deg);opacity:0}}

/* ===== CARD (two-faced) ===== */
#cardWrap{perspective:1400px;}
.hidden{display:none;}
.card3d{width:min(72vw,300px);aspect-ratio:12/17;position:relative;transform-style:preserve-3d;}
.card3d.flip{animation:flip 1.4s cubic-bezier(.3,.7,.3,1) forwards;}
@keyframes flip{0%{transform:rotateY(0) scale(.82)}100%{transform:rotateY(540deg) scale(1)}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(60,20,60,.4);}
.face.back{background:linear-gradient(150deg,#2b2b2e,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:2px solid rgba(244,201,69,.35);}
.face.back img{width:46%;}
.face.back .bk{color:var(--gold);font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:1px;}
.face.front{transform:rotateY(180deg);background:var(--grad-card);}
.face.front img{width:100%;height:100%;object-fit:cover;}
.front .fallback{position:absolute;inset:0;display:none;flex-direction:column;color:#3a2330;}
.front .fallback.show{display:flex;}
.fb-bar{display:flex;justify-content:space-between;padding:7px 10px;background:linear-gradient(#fff,rgba(255,255,255,.6));font-family:var(--font-display);font-weight:700;font-size:11px;}
.fb-bar .r{color:var(--red);} .fb-bar .t{color:#555;}
.fb-title{font-family:var(--font-display);font-weight:700;font-size:19px;padding:6px 12px;}
.fb-art{flex:1;margin:0 10px;border-radius:8px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:12px;
  background:linear-gradient(135deg,#ffe1a8,#ffc0e0 55%,#cdd6ff);padding:14px;}
.fb-text{margin:8px 10px 12px;background:rgba(255,255,255,.6);border-radius:8px;padding:9px;font-size:11px;}

/* ===== NAV REVEAL ===== */
#navReveal{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(86vw,300px);}
#navReveal a{opacity:0;transform:translateY(-16px);transition:opacity .5s ease,transform .5s ease,background .15s;
  background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:19px;
  padding:13px 20px;border-radius:14px;text-align:center;box-shadow:var(--shadow-sm);}
#navReveal a:hover{text-decoration:none;transform:translateY(-2px) scale(1.02);background:#fff;}
#navReveal.in a{opacity:1;transform:none;}
#navReveal.in a:nth-child(1){transition-delay:.05s}
#navReveal.in a:nth-child(2){transition-delay:.16s}
#navReveal.in a:nth-child(3){transition-delay:.27s}
#navReveal.in a:nth-child(4){transition-delay:.38s}
#navReveal.in a:nth-child(5){transition-delay:.49s}
#navReveal.in a:nth-child(6){transition-delay:.60s}
#navReveal a.ink{color:var(--red);font-weight:700;}
#navReveal a .em{margin-right:8px;}

@media(min-width:761px){
  #stage.settled{flex-direction:row;gap:7vw;align-items:center;justify-content:center;}
  #stage.settled #cardWrap{order:2;}
  #stage.settled #navReveal{order:1;width:min(40vw,340px);}
  #stage.settled .card3d{width:min(34vw,300px);}
}
@media(max-width:760px){
  #stage.settled #cardWrap{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);opacity:.22;z-index:1;pointer-events:none;}
  #stage.settled #navReveal{position:relative;z-index:3;}
}

#skip{position:fixed;bottom:16px;right:18px;z-index:7;font-weight:800;font-size:14px;color:var(--ink-soft);
  background:rgba(255,255,255,.8);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow-sm);}
#skip.gone{display:none;}
@media(prefers-reduced-motion:reduce){.pack{animation:none;}}
</style>
</head>
<body>
<div id="bgWhite"></div>
<div id="bgCard"></div>
<div id="starburst"></div>

<main id="stage">
  <!-- PACK -->
  <div id="packWrap">
    <div id="taphint">Tap anywhere to open<span class="sub">a card from B. Cake</span></div>
    <div id="pack" class="pack" role="button" tabindex="0" aria-label="Open the pack">
      <div class="seam"></div>
      <div class="tearline"></div>
      <img class="logo" src="tradingcard-logo.png" alt="" />
      <!-- <img class="logo" src="logo.png" alt="" />-->
      <div class="pname">B. CAKE<small>TATTOO PACK</small></div> 
    </div>
  </div>

  <!-- CARD -->
  <div id="cardWrap" class="hidden">
    <div id="card" class="card3d">
      <div class="face back">
        <img src="logo.png" alt="" />
        <div class="bk">B. CAKE</div>
      </div>
      <div class="face front">
        <img src="bcake-card.jpg" alt="Ink by B. Cake card"
             onerror="this.style.display='none';this.parentNode.querySelector('.fallback').classList.add('show');" />
        <div class="fallback">
          <div class="fb-bar"><span class="r">Supporter</span><span class="t">TATTOO ARTIST</span></div>
          <div class="fb-title">Ink by B. Cake</div>
          <div class="fb-art">Card art goes here<br><small>save as <b>bcake-card.jpg</b></small></div>
          <div class="fb-text">Play this card to gain 100 Aura Points. The user will take 10 damage for each use.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- NAV -->
  <nav id="navReveal" class="hidden" aria-label="Main">
    <a href="about.html"><span class="em"></span>About Me</a>
    <a href="gallery.html"><span class="em"></span>Gallery</a>
    <a href="get-inked.html" class="ink"><span class="em"></span>Get Inked</a>
    <a href="aftercare.html"><span class="em"></span>Aftercare</a>
    <a href="merch.html"><span class="em"></span>Merch</a>
    <a href="location.html"><span class="em"></span>Location &amp; Events</a>
  </nav>
</main>

<button id="skip" type="button">Skip intro</button>

<script>
const body=document.body, pack=document.getElementById('pack'), cardWrap=document.getElementById('cardWrap'),
  card=document.getElementById('card'), nav=document.getElementById('navReveal'), hint=document.getElementById('taphint'),
  burst=document.getElementById('starburst'), stage=document.getElementById('stage'), skip=document.getElementById('skip');
let started=false;
const isMobile=()=>window.matchMedia('(max-width:760px)').matches;

function finishLayout(){
  body.classList.add('toCard','done');
  if(isMobile())body.classList.add('dim');
  stage.classList.add('settled');
  nav.classList.remove('hidden');
  void nav.offsetWidth;            /* force reflow so transition runs */
  nav.classList.add('in');
  hint.style.display='none';
  skip.classList.add('gone');
}

function flattenCard(){
  card.style.animation='none';card.style.transform='none';card.style.transformStyle='flat';
  const f=card.querySelector('.face.front'),b=card.querySelector('.face.back');
  if(f)f.style.transform='none';if(b)b.style.display='none';
}
function play(){
  if(started)return;started=true;
  hint.style.display='none';
  pack.classList.add('rip');
  setTimeout(()=>{ pack.classList.add('fall'); cardWrap.classList.remove('hidden'); },520);
  setTimeout(()=>{ pack.style.display='none'; card.classList.add('flip'); card.addEventListener('animationend',flattenCard,{once:true}); body.classList.add('toCard'); if(isMobile())body.classList.add('dim'); },1050);
  setTimeout(()=>{ burst.classList.add('fire'); },2400);
  setTimeout(()=>{ stage.classList.add('settled'); body.classList.add('done'); },3450);
  setTimeout(()=>{ nav.classList.remove('hidden'); void nav.offsetWidth; nav.classList.add('in'); hint.style.display='none'; skip.classList.add('gone'); },3550);
}

function instant(){
  if(started)return;started=true;
  pack.style.display='none'; cardWrap.classList.remove('hidden'); flattenCard();
  finishLayout();
}

/* tap anywhere (during idle) opens; ignore clicks on skip */
document.addEventListener('click',e=>{ if(started)return; if(e.target.closest('#skip'))return; e.preventDefault(); e.stopPropagation(); play(); }, true);
document.addEventListener('keydown',e=>{ if(!started&&(e.key==='Enter'||e.key===' ')){e.preventDefault();play();} });
// skip.addEventListener('click',e=>{ e.stopPropagation(); if(started){return;} instant(); });
</script>
</body>
</html>
